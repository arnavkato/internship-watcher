name: poll
on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min — free & unlimited on a public repo
  workflow_dispatch: {}       # lets you run it manually from the Actions tab

permissions:
  contents: write             # to commit seen.json / listings.csv back

concurrency: poll             # never overlap two runs

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python jobs.py poll        # pure stdlib, no pip install
        env:
          JOBS_DISCORD_WEBHOOK: ${{ secrets.JOBS_DISCORD_WEBHOOK }}
      - name: commit state
        run: |
          git config user.name "Arnav Katoch"
          git config user.email "173016773+arnavkato@users.noreply.github.com"
          git add seen.json listings.csv
          git commit -m "poll: refresh state" || echo "nothing to commit"
          git push
